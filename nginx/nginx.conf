# ArchLens AI reverse proxy (plain HTTP; terminate TLS in front of this —
# see README "Production TLS").
#
#   /api/*  → FastAPI backend (prefix stripped: /api/v1/analyses → /v1/analyses)
#   /*      → TanStack Start SSR frontend (pages and /assets/*)

# Per-client limit on POSTs to the API (uploads and Copilot questions). GETs are
# not limited here; an empty key is never limited. The backend applies its own,
# stricter Copilot limits (ARCHLENS_LLM_RATE_PER_MINUTE etc.).
map $request_method $archlens_post_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $archlens_post_client zone=archlens_post:10m rate=20r/m;

upstream archlens_backend {
    server backend:8000;
}

upstream archlens_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Keep in step with ARCHLENS_MAX_UPLOAD_MB (default 50) plus multipart overhead.
    client_max_body_size 55m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge: overwrite rather than append, so clients cannot spoof
    # the address the backend rate-limits on. If you put a TLS terminator in
    # front, configure real_ip here (set_real_ip_from / real_ip_header).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Liveness of the proxy itself.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Trailing slash on proxy_pass strips the /api/ prefix.
        proxy_pass http://archlens_backend/;
        # Fail fast with 502 when the backend is down...
        proxy_connect_timeout 5s;
        # ...but allow long reads: analyses run synchronously inside the request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        limit_req zone=archlens_post burst=10 nodelay;
        limit_req_status 429;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        proxy_pass http://archlens_frontend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://archlens_frontend;
    }
}
