# ArchLens AI — local stack: nginx → (frontend SSR, FastAPI backend).
#
#   docker compose up --build -d
#   open http://localhost:8080
#
# Only nginx is published. Backend configuration comes from the optional
# ./backend/.env (copy backend/.env.example); it is read at runtime and never
# copied into an image.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ARCHLENS_ANALYSES_DIR: /app/output/analyses
      ARCHLENS_ARTIFACTS_DIR: /app/output
    volumes:
      - archlens-data:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${ARCHLENS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  archlens-data:
